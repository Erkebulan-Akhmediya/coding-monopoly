# Production stack: PostgreSQL + game server (Go binary with embedded Vue client).
#
# Migrations are NOT run automatically. First deploy:
#
#   cp .env.prod.example .env.prod   # then fill in secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
#   # apply schema manually (db is only reachable on the internal network):
#   set -a && . ./.env.prod && set +a
#   docker run --rm --network monopoly-backend \
#     -v "$PWD/server/migrations:/migrations:ro" migrate/migrate:v4.18.3 \
#     -path=/migrations \
#     -database "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable" up
#
#   # optional, fresh databases only — TRUNCATES game/content tables:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod exec game monopoly-seed
#   docker compose -f docker-compose.prod.yml --env-file .env.prod restart game

name: monopoly

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monopoly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-monopoly}
    # No published ports: Postgres must never be reachable from the student LAN.
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging: *logging

  game:
    build:
      context: .
      dockerfile: Dockerfile
    image: coding-monopoly:${GAME_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      # Password must be URL-safe (e.g. `openssl rand -hex 32`) since it is embedded in the DSN.
      DATABASE_URL: postgres://${POSTGRES_USER:-monopoly}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}@db:5432/${POSTGRES_DB:-monopoly}?sslmode=disable
      LISTEN_ADDR: 0.0.0.0:8080
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env.prod}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:?set ADMIN_TOKEN_SECRET in .env.prod}
      ADMIN_TOKEN_TTL: ${ADMIN_TOKEN_TTL:-15m}
    ports:
      - "${GAME_BIND_ADDR:-0.0.0.0}:${GAME_PORT:-8080}:8080"
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging: *logging

networks:
  frontend:
    name: monopoly-frontend
  backend:
    name: monopoly-backend
    internal: true

volumes:
  pgdata:
    name: monopoly-pgdata
